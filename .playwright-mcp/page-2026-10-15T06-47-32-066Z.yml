              - heading "3.2 场景：业务受理/审查人员处理一笔业务的影像材料（端到端） P1" [level=2] [ref=f7e308]:
                - generic [ref=f7e309]: "3.2"
                - text: 场景：业务受理/审查人员处理一笔业务的影像材料（端到端）
                - generic [ref=f7e310]: P1
              - paragraph [ref=f7e311]: "业务受理/审查人员收到一笔信贷业务的影像材料：若干 PDF 扫描件和一个打包的压缩件。他在影像中心 /library 创建受理单，系统按该业务线影像树固化结构快照并分配唯一受理单号（受理单绑定哪棵影像树、由谁或哪个参数选定，素材未定义【TBD-17】）；通过受理对话框上传 PDF 与压缩包，压缩包被展开为子文件逐一派发处理。随后他在受理单工作台 /cases/{caseId} 沿五阶段推进：解析识别阶段，PDF 走 OCR 链路（探测模型 → 候选模型路由 → MinerU 提交 → 结果摄取），完成后形成标准解析数据；影像分类阶段，系统以双路径给出仲裁结论，低置信文档进入 REVIEW_REQUIRED，他在左侧「文档列表/影像树」双视图中逐份确认影像分类（AUTO_CONFIRMED 的可直接放行）；数据提取阶段，系统按材料的结果定义完成结构化抽取与字段校验；影像审查阶段，校验场景随事实变化自动补算；结果确认阶段，他核对后执行「确认结果」，最后整单提交。"
              - paragraph [ref=f7e312]: 正常结果：各文档结果发布固化（携带 publishedAt 与 schemaHash），后续可被查询与对外交付。
              - paragraph [ref=f7e313]: 异常分支：若影像树要求的部分必需影像未上传，详情页展示缺失清单，已上传影像仍可审查，但整单提交被拦截并返回缺失影像清单；若某 PDF 的 OCR 提交失败或证据 Profile 未就绪，该文档进入显式失败状态，他可在审阅页看到失败原因，其中 OCR 识别错误可通过识别修复编辑器人工修正。
            - generic [ref=f7e314]:
              - heading "3.3 场景：尽调系统经对外 API 委托处理并取数 P1" [level=2] [ref=f7e315]:
                - generic [ref=f7e316]: "3.3"
                - text: 场景：尽调系统经对外 API 委托处理并取数
                - generic [ref=f7e317]: P1
              - paragraph [ref=f7e318]: 尽调侧工程师要为一笔业务取结构化材料数据。他先取得文件凭证：或调用方先经平台上传拿到 platformFileId，或调 POST /external/files/upload（携带 Idempotency-Key）拿到 uploadId 与有效期。随后 POST /external/cases/create 提交 businessRef、工作模式与文档清单（每个文档只带两种凭证之一），系统受理后经 SSE 推送 RESULT_AVAILABLE 事件（必带 resourcePath、resourceMethod=POST、businessRef）。他按 eventId 幂等消费事件，再 POST 查询进度接口与七个单文档结果接口；对批量取数，按 materialCode 调按分类取数接口，命中多份时全部返回且顺序固定。
              - paragraph [ref=f7e319]: 正常结果：拿到带 publishedAt 与 schemaHash 的已发布结构化数据。
              - paragraph [ref=f7e320]: 异常分支：按分类取数命中 0 份时返回 200 + 空 items（不是 404）；materialCode 不存在时返回 MATERIAL_NOT_FOUND，两者严格区分；部分影像未完成时单项带 withheldReason（AWAITING_FINAL_CONFIRMATION / RESULT_NOT_READY / RESULT_FAILED），不影响其余影像返回；重试时同键同内容重放首次结果，同键不同内容得到 409 IDEMPOTENCY_CONFLICT；受理请求 PROCESSING 超过 15 分钟由系统自动恢复（未建单记失败可重试、已建单续收、已有文档补记成功）。
            - generic [ref=f7e321]:
              - heading "3.4 场景：分类/配置管理员配置分类并用 Agent 优化 P1" [level=2] [ref=f7e322]:
                - generic [ref=f7e323]: "3.4"
                - text: 场景：分类/配置管理员配置分类并用 Agent 优化
                - generic [ref=f7e324]: P1
              - paragraph [ref=f7e325]: 分类/配置管理员在材料配置中心为新材料配置智能分类项（语义判断、关键识别词、别名、负向证据），并用案例验证与效果统计检查配置效果。某类材料持续被分错时，他在智能分类助手创建「优化分类」任务并选定目标分类，系统冻结案例样本、文档运行版本、当前执行与人工确认结果、配置基线与预算。Agent 运行中仅能使用三个注册工具检索证据与生成草案修订，每产生新 Draft 自动执行两项必验（当前案例路径 A 真实试算 + 分类回归）；他在三栏工作台观察运行上下文、运行信息与草案产物，进度由 SSE 事件驱动刷新。最新 Draft 两项必验全部 PASSED、hash 匹配且输入无漂移时任务达到 READY_FOR_REVIEW，他查看草案与验证结果后走草案发布门禁确认发布。
              - paragraph [ref=f7e326]: 异常分支：Agent 连续重复无进展时先被拒绝原计划强制改证据问题，再重复则结构化阻断；预算耗尽得到结构化阻断提示（不隐藏续跑）；验证失败不是任务失败，失败 Draft 携带 errorCode / suggestedFocus 进入下一轮。注意：人工暂停/恢复/取消/退回/修订当前未实现（见 5.9.3），场景中不可依赖。
