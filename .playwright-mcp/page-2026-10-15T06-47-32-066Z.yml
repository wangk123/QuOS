                - generic [ref=f7e330]: P1
              - paragraph [ref=f7e331]: "文档复核人员在文档审阅工作台 /documents/{id} 打开一份抽取完成的文档，切换子文件，在原文预览中查看字段级证据高亮（block/region/页码/坐标/原文）。他核对抽取结果页签中的结果块与字段；发现识别错误时用识别修复编辑器修正 OCR 结果，发现字段错误时直接编辑字段。发布前系统执行字段校验与数据勾稽（等值/合计/加减），失败则阻止发布并给出缺失/阻断项清单；他补正后重新校验。配置单位与材料实际单位不一致且值非零时，字段值保持原始值不换算，仅以 unitWarning 附带配置单位与来源单位。确认无误后执行发布，结果固化且携带 publishedAt 与运行绑定的 schemaHash，此后不可再改。"
