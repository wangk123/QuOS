<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuOS v2 · 高保真原型</title>
<!--
  PROTOTYPE — 抛弃型高保真原型(规格用途)· R2 版
  变更:①信息架构改为「项目内资源」(侧栏项目树);②专业级视觉(深色侧栏+克制蓝);
       ③评审重构为文档批注式(先成文、正文标记、右侧对照/逐条评审)。
  数据:纯 mock,内存态,刷新即重置。零依赖,浏览器直接打开。
  对应 change:openspec/changes/quos-v2-rebuild
-->
<style>
:root{
  /* 骨架 */
  --side-bg:#0C1425; --side-fg:#8A94A6; --side-fg-strong:#E7ECF3; --side-hover:#141F38; --side-active:#1D2B4D;
  --side-border:#1B2740; --topbar:#FFFFFF; --bg:#F4F6F8; --card:#FFFFFF;
  --fg:#111827; --fg-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --border:#E5E7EB; --border-2:#D1D5DB;
  /* 主色:收敛为深蓝 */
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-soft:#EFF4FF;
  /* 语义 */
  --anno:#D97706; --anno-bg:#FFFBEB; --anno-line:#F59E0B;
  --ok:#059669; --ok-soft:#ECFDF5; --danger:#DC2626; --danger-soft:#FEF2F2;
  --ring:0 0 0 3px rgba(37,99,235,.28);
  --radius:6px; --radius-sm:4px;
  --shadow:0 1px 2px rgba(16,24,40,.06); --shadow-lg:0 12px 32px rgba(16,24,40,.16);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::selection{background:#DBEAFE}

/* ── 应用骨架:侧栏 + 顶条 + 内容 ── */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-logo{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;color:var(--side-fg-strong);font-weight:700;font-size:1.02rem;letter-spacing:.3px}
.side-logo .mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#2563EB,#1D4ED8);display:grid;place-items:center;color:#fff;flex:none}
.side-sec{padding:6px 10px 2px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5B6779}
.side a.item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 6px;border-radius:var(--radius-sm);color:var(--side-fg);text-decoration:none;font-size:.88rem;font-weight:500;min-height:38px;transition:background .15s,color .15s}
.side a.item:hover{background:var(--side-hover);color:var(--side-fg-strong)}
.side a.item.active{background:var(--side-active);color:#fff}
.side a.item .cnt{margin-left:auto;background:#DC2626;color:#fff;font-size:.68rem;font-weight:700;border-radius:99px;padding:0 6px;line-height:16px;min-width:16px;text-align:center}
.side a.item .cnt.blue{background:#2563EB}
.side .proj-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--side-border);font-size:.72rem;color:#5B6779}
.side-foot .proto{display:inline-block;border:1px dashed #3A4763;color:#94A3B8;border-radius:99px;padding:1px 9px;margin-bottom:4px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--topbar);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;gap:8px;padding:0 28px;position:sticky;top:0;z-index:40}
.crumb{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}
.crumb .sep{color:var(--border-2)}
.topbar .spacer{flex:1}
.content{padding:26px 28px 90px;max-width:1460px;width:100%;margin:0 auto}

/* ── 通用 ── */
h1.pv{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.pv-sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;min-height:36px;border-radius:var(--radius-sm);border:1px solid var(--border-2);background:var(--card);font-weight:600;font-size:.86rem;color:var(--fg-2);transition:all .18s}
.btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger);border-color:#FCA5A5}
.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:4px 11px;min-height:29px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--muted);transition:all .15s}
.icon-btn:hover{background:var(--bg);color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;background:#F3F4F6;color:var(--fg-2);border:1px solid var(--border);white-space:nowrap}
.tag .dot{width:6px;height:6px;border-radius:99px;flex:none}
.tag.ok .dot{background:var(--ok)} .tag.warn .dot{background:var(--anno)} .tag.err .dot{background:var(--danger)}
.tag.info .dot{background:var(--primary)} .tag.mute .dot{background:var(--faint)}

/* ── 表格 ── */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 16px;border-bottom:1px solid var(--border);background:#FAFBFC}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:.88rem}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover{background:#F8FAFC}
.num{font-family:var(--mono);font-size:.85rem}

/* ── 弹窗 / Toast / Drawer ── */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:100;display:grid;place-items:center;animation:fadein .16s ease}
.dialog{background:var(--card);border-radius:10px;box-shadow:var(--shadow-lg);width:min(520px,92vw);max-height:84vh;overflow:auto;animation:pop .18s ease}
.dialog .d-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.dialog .d-head h3{font-size:1.04rem;font-weight:700}
.dialog .d-body{padding:16px 22px}
.dialog .d-foot{display:flex;justify-content:flex-end;gap:10px;padding:4px 22px 20px}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}}
.field{margin-bottom:14px}
.field label{display:block;font-size:.83rem;font-weight:600;margin-bottom:6px}
.field .req{color:var(--danger)}
.field input[type=text],.field textarea{width:100%;padding:8px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);background:var(--card);transition:border-color .18s;min-height:38px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:var(--ring);outline:none}
.field .err-msg{color:var(--danger);font-size:.78rem;margin-top:5px;display:none}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err-msg{display:block}
.d-note{margin-right:auto;color:var(--muted);font-size:.8rem;align-self:center}
.toasts{position:fixed;top:66px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:#111827;color:#fff;padding:10px 16px;border-radius:var(--radius);box-shadow:var(--shadow-lg);font-size:.86rem;font-weight:500;animation:slidein .22s ease}
.toast.success .t-i{color:#34D399}.toast.warn .t-i{color:#FBBF24}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}}
.drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,.32);z-index:90;animation:fadein .16s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--card);z-index:95;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:drawerin .2s ease}
@keyframes drawerin{from{transform:translateX(36px);opacity:0}}
.drawer .dr-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--border)}
.drawer .dr-head h3{font-size:.96rem;font-weight:700;flex:1;word-break:break-all}
.drawer .dr-meta{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--muted)}
.drawer .dr-body{flex:1;overflow:auto;padding:16px 20px;background:#FAFBFC}
.parsed{font-family:var(--mono);font-size:.78rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--fg-2);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}

/* ── 材料页 ── */
.upload-zone{border:1.5px dashed var(--border-2);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);margin-bottom:18px;transition:all .18s;cursor:pointer;background:var(--card)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark)}
.upload-zone b{color:var(--fg);font-size:.9rem}
.upload-zone .hint{font-size:.78rem}
.mt{display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.mt.pdf{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.mt.md{color:#1D4ED8;background:#EFF6FF;border-color:#BFDBFE}
.mt.txt{color:var(--muted);background:#F9FAFB}
.mt.img{color:#0F766E;background:#F0FDFA;border-color:#99F6E4}
.hash{font-family:var(--mono);font-size:.74rem;color:var(--faint)}
.row-sel{background:var(--primary-soft)!important;box-shadow:inset 2px 0 0 var(--primary)}
.empty{padding:44px 24px;text-align:center;color:var(--muted);font-size:.9rem}

/* ── 文档评审页(核心):固定视口,三栏各自独立滚动 ── */
.content.fixed{padding:0;height:calc(100vh - 54px);max-width:none;display:flex;flex-direction:column;overflow:hidden}
.rev-toolbar{display:flex;align-items:center;gap:12px;padding:12px 24px 10px;flex:none;border-bottom:1px solid var(--border);background:#FAFBFC;flex-wrap:wrap}
.rev-toolbar .spacer{flex:1}
.rev-body{flex:1;min-height:0;display:grid;grid-template-columns:208px minmax(0,1fr) 344px}
.rev-col{overflow-y:auto;min-height:0}
.doc-col{border-left:1px solid var(--border);border-right:1px solid var(--border);padding:22px 26px 70px;background:var(--bg)}
.rail-col{padding:14px 14px 40px}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--radius-sm);overflow:hidden;background:var(--card)}
.seg button{padding:6px 13px;border:none;background:transparent;font-weight:600;font-size:.82rem;color:var(--muted);min-height:34px;transition:all .14s}
.seg button+button{border-left:1px solid var(--border)}
.seg button.active{background:var(--primary-soft);color:var(--primary-dark)}
.seg button.reviewing{color:var(--anno)}
.seg button.reviewing.active{background:var(--anno-bg);color:#92400E}
.toc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 8px;box-shadow:var(--shadow);position:sticky;top:0}
.toc .t{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px 8px}
.toc a{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:var(--radius-sm);color:var(--fg-2);text-decoration:none;font-size:.85rem;font-weight:500;transition:all .13s}
.toc a:hover{background:var(--bg)}
.toc a.current{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.toc a .n-anno{margin-left:auto;font-size:.68rem;font-weight:700;color:var(--anno);background:var(--anno-bg);border-radius:99px;padding:0 6px;line-height:15px}
.toc .gloss{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.toc .gloss a{font-weight:400;color:var(--muted);font-size:.82rem}
.toc .gloss a:hover{color:var(--fg-2)}
/* 「更多」下拉菜单(低频设置):幽灵按钮 + 图形化选项 */
.more-wrap{position:relative;display:inline-flex}
.more-btn{width:28px;height:28px;border:none;background:transparent;color:var(--faint);display:grid;place-items:center;border-radius:var(--radius-sm);transition:all .15s;opacity:.85}
.more-btn:hover{color:var(--fg-2);background:var(--bg);opacity:1}
.more-btn svg{display:block}
.more-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(16,24,40,.14),0 1px 3px rgba(16,24,40,.08);padding:7px;min-width:186px;z-index:70;animation:mmenu .16s cubic-bezier(.2,.8,.3,1);transform-origin:top right}
@keyframes mmenu{from{opacity:0;transform:scale(.96) translateY(-3px)}}
.more-menu .mm-t{font-size:.66rem;font-weight:600;color:var(--faint);letter-spacing:.08em;padding:5px 11px 4px}
.more-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 11px;border:none;background:none;font-size:.84rem;color:var(--fg-2);border-radius:6px;cursor:pointer;transition:background .12s,color .12s}
.more-menu button:hover{background:var(--bg);color:var(--fg)}
.more-menu button .mm-ic{width:22px;height:14px;flex:none;display:grid;place-items:center;color:var(--faint)}
.more-menu button .mm-ic svg{display:block}
.more-menu button .mm-lb{flex:1;text-align:left}
.more-menu button .mm-dot{width:5px;height:5px;border-radius:99px;background:var(--primary);opacity:0;flex:none;transition:opacity .12s}
.more-menu button.sel{color:var(--primary-dark);font-weight:600}
.more-menu button.sel .mm-ic{color:var(--primary)}
.more-menu button.sel .mm-dot{opacity:1}
/* 版本行操作(回退) */
.vitem .vv .v-act{margin-left:auto}

/* 文档正文:页宽三档 */
.doc-main{min-width:0}
.docpaper{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 42px 44px;margin:0 auto;max-width:820px;transition:max-width .2s ease}
.rev-body.wide .docpaper{max-width:1140px}
.rev-body.full .docpaper{max-width:none}
.rev-body.wide .docpaper,.rev-body.full .docpaper{padding:34px 48px 44px}
.docpaper .doc-title{font-size:1.28rem;font-weight:700;letter-spacing:-.01em;padding-bottom:4px}
.docpaper .doc-meta{display:flex;gap:14px;color:var(--muted);font-size:.8rem;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px;flex-wrap:wrap}
.chapter{padding-top:26px;scroll-margin-top:76px}
.chapter h2{font-size:1.06rem;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.chapter h2 .pri{font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:99px;background:#F3F4F6;color:var(--muted);border:1px solid var(--border)}
.chapter h2 .ch-anno{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--anno);background:var(--anno-bg);border:1px solid #FDE68A;border-radius:99px;padding:1px 8px;cursor:pointer}
.sl{font-size:.72rem;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 6px}
.chapter p.bg{color:var(--fg-2);font-size:.9rem}
.flowbox{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 13px;background:#FAFBFC;border:1px solid var(--border);border-radius:var(--radius-sm)}
.fnode{padding:4px 11px;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--primary-dark);font-weight:600;font-size:.78rem;border:1px solid #DBEAFE}
.fnode.term{background:#F3F4F6;color:var(--muted);border-color:var(--border)}
.farr{color:var(--faint);font-size:.76rem}
.exc{list-style:none}
.exc li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.87rem}
.exc li:last-child{border-bottom:none}
.exc .e{color:var(--danger);font-weight:700;font-family:var(--mono);font-size:.74rem;padding-top:2px}
.rline{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F6;font-size:.89rem;align-items:baseline}
.rline:last-child{border-bottom:none}
.rline .rno{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--primary-dark);background:var(--primary-soft);border:1px solid #DBEAFE;border-radius:var(--radius-sm);padding:1px 7px;flex:none;transform:translateY(-1px)}
.rline .rno.void{color:var(--faint);background:#F3F4F6;border-color:var(--border);text-decoration:line-through}
.rline .rv{color:var(--faint);font-size:.76rem;margin-left:auto;flex:none;font-family:var(--mono)}
.rline p{flex:1}

/* 批注标记(Word 批注式) */
mark.anno{background:linear-gradient(transparent 55%,#FEF3C7 55%);border-bottom:2px solid var(--anno-line);color:inherit;cursor:pointer;padding:0 1px;border-radius:1px;transition:background .15s}
mark.anno:hover{background:linear-gradient(transparent 0%,#FDE68A 0%)}
mark.anno.hit{background:#FDE68A;box-shadow:0 0 0 2px rgba(217,119,6,.25)}
mark.anno sup{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--anno);margin-left:2px}
mark.anno.resolved{border-bottom-color:var(--ok);background:linear-gradient(transparent 55%,#D1FAE5 55%)}
mark.anno.resolved sup{color:var(--ok)}

/* 右侧批注栏:折叠态 */
.anno-rail{display:flex;flex-direction:column;min-height:0}
.anno-head{display:flex;align-items:center;gap:10px;padding:0 2px 10px;flex:none}
.anno-head .sum{font-size:.84rem;color:var(--muted)}
.anno-head .sum b{color:var(--anno)}
.anno-list{display:flex;flex-direction:column;gap:8px;padding-right:2px}
.agroup{font-size:.7rem;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:8px 2px 0;display:flex;align-items:center;gap:8px;flex:none}
.agroup::after{content:"";flex:1;height:1px;background:var(--border)}
.acard{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--anno-line);border-radius:var(--radius);padding:8px 12px;transition:box-shadow .15s,border-color .15s}
.acard.ok{border-left-color:var(--ok)}
.acard.active{box-shadow:0 0 0 2px rgba(217,119,6,.3);border-color:var(--anno-line)}
.acard .a-top{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.acard .a-q{font-size:.85rem;font-weight:600;color:var(--fg);flex:1;min-width:0}
.acard.closed .a-q{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .a-meta{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--faint);margin-top:1px;line-height:1.4}
.acard .a-meta .a-id{font-family:var(--mono);font-weight:600;letter-spacing:.02em}
.acard.ok .a-meta .a-kind{color:var(--ok)}
.acard .a-locate{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--faint);border:none;background:transparent;transition:all .14s}
.acard .a-locate:hover{color:var(--primary);background:var(--primary-soft)}
.acard .a-chev{flex:none;color:var(--faint);font-size:.72rem;transition:transform .15s}
.acard:not(.closed) .a-chev{transform:rotate(90deg)}
.acard .a-body{margin-top:8px}
.acard.closed .a-body{display:none}
.acard .a-ctx{font-size:.76rem;color:var(--muted);margin:0 0 8px;padding:5px 9px;background:#FAFBFC;border-radius:var(--radius-sm);border-left:2px solid var(--border-2)}
.acard .a-ops{display:flex;flex-direction:column;gap:6px}
.aopt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--card);transition:all .13s;font-size:.83rem}
.aopt:hover{border-color:var(--primary)}
.aopt.sel{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
.aopt .k{font-family:var(--mono);font-weight:700;font-size:.72rem;color:var(--muted)}
.aopt .c{display:block;color:var(--muted);font-size:.76rem;font-weight:400}
.afield{margin-top:9px}
.afield input{width:100%;padding:7px 11px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:.84rem}
.afield input:focus{border-color:var(--primary);box-shadow:var(--ring);outline:none}
.abtns{display:flex;gap:8px;margin-top:9px}
.abtns .btn{flex:1;justify-content:center;min-height:34px}
.abtns .btn.yes.sel{background:var(--ok-soft);border-color:var(--ok);color:#065F46}
.abtns .btn.no.sel{background:var(--danger-soft);border-color:#FCA5A5;color:#991B1B}
.scanmini{margin-top:9px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.scanmini .sr{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);font-size:.78rem;cursor:pointer}
.scanmini .sr:last-child{border-bottom:none}
.scanmini .sr.done{color:var(--faint)}
.scanmini .sr.done .mk{margin-left:auto;color:var(--ok);font-weight:700;font-size:.72rem;display:inline}
.scanmini .sr .mk{margin-left:auto;display:none}
.scanmini input{accent-color:var(--primary);width:14px;height:14px}
.a-done{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:.8rem;color:var(--ok);font-weight:600}
.a-done .da-text{color:var(--fg-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* 逐条评审模式 */
.focusbox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:18px 20px}
.focus-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.focus-top .fp{font-size:.84rem;color:var(--muted)}
.focus-top .fp b{color:var(--fg)}
.focus-nav{display:flex;gap:8px;margin-left:auto}
.focus-wrap{position:sticky;top:80px}
.focus-jump{margin-top:10px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:7px;padding:8px 11px;background:#FAFBFC;border:1px solid var(--border);border-radius:var(--radius-sm)}
.focus-jump .fq{color:var(--anno);font-weight:700;font-family:var(--mono)}

/* 草案横幅 */
.draft-banner{display:flex;align-items:center;gap:12px;background:var(--anno-bg);border:1px solid #FDE68A;border-radius:var(--radius);padding:10px 16px;margin-bottom:16px}
.draft-banner .db{flex:1;font-size:.85rem;color:#78350F}
.draft-banner .db b{font-weight:700}

/* 版本页 */
.ver-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.vline{position:relative;padding-left:18px}
.vline::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--border)}
.vitem{position:relative;padding:10px 14px;margin-bottom:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .14s}
.vitem::before{content:"";position:absolute;left:-18px;top:16px;width:8px;height:8px;border-radius:99px;background:var(--border-2);border:2px solid var(--card)}

.crow{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:9px;background:var(--card);overflow:hidden}

.crow .ch:hover{background:var(--bg)}

.crow .cs{flex:1;font-size:.85rem;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cb{border-top:1px solid var(--border);padding:12px 15px;background:#FAFBFC;animation:fadein .15s ease}

.cmeta{font-size:.76rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

  $("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),320)},2600)}
function modal({title,body,foot}){const root=$("#modalRoot");
  root.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">
   <div class="d-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
   <div class="d-body">${body}</div><div class="d-foot">${foot}</div></div></div>`;
  root.querySelector(".overlay").addEventListener("click",e=>{if(e.target.classList.contains("overlay"))root.innerHTML=""});
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>root.innerHTML=""));return root}

/* ═════════════ 骨架渲染 ═════════════ */
function renderSide(){
  const inProj=!!S.page&&S.page!=="projects";
  const sub=[["materials","材料",curProj()?.stats.materials,null],["review","文档评审",curProj()?.stats.anno,""],["versions","版本",null,null]];
  $("#side").innerHTML=`
   <div class="side-logo"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>QuOS</div>
   <div class="side-sec">项目</div>
   <a class="item ${!inProj?"active":""}" href="#/projects" style="gap:8px">${IC.folder} 项目总览</a>
   ${DB.projects.filter(p=>!p.archived).map(p=>`
     <a class="item ${inProj&&p.id===S.pid&&!sub.some(([k])=>k===S.page)?"active":""}" href="#/p/${p.id}/review" style="padding-left:14px">
       <span class="proj-name">${esc(p.name)}</span>
       ${p.stats.draft==="reviewing"?`<span class="cnt blue" title="草案评审中">草</span>`:""}</a>
     ${inProj&&p.id===S.pid?sub.map(([k,label,cnt,cls])=>`
       <a class="item ${S.page===k?"active":""}" href="#/p/${p.id}/${k}" style="padding-left:34px;font-size:.83rem">
         <span class="proj-name">${label}</span>${cnt?`<span class="cnt ${cls||""}">${cnt}</span>`:""}</a>`).join(""):""}`).join("")}
   <div class="side-sec" style="margin-top:10px">归档</div>
   ${DB.projects.filter(p=>p.archived).map(p=>`<a class="item" href="#/projects" style="padding-left:14px;opacity:.65">${IC.arch} <span class="proj-name">${esc(p.name)}</span></a>`).join("")||`<div style="padding:4px 16px;font-size:.8rem;color:#5B6779">无</div>`}
   <div class="side-foot"><span class="proto">v2 原型 · R2</span><br>mock 数据 · 刷新重置</div>`;
}
function crumb(){
  const p=curProj();
  if(!S.page||S.page==="projects")return`<div class="crumb"><b>项目总览</b></div>`;
  const names={materials:"材料",review:"文档评审",versions:"版本"};
  return`<div class="crumb"><a href="#/projects" style="color:var(--muted);text-decoration:none">QuOS</a><span class="sep">/</span><a href="#/p/${S.pid}/review" style="color:var(--muted);text-decoration:none">${esc(p?.name||"")}</a><span class="sep">/</span><b>${names[S.page]||""}</b></div>`;
}
function renderTopbar(extra=""){$("#topbar").innerHTML=crumb()+`<span class="spacer"></span>`+extra}
function route(){
  const h=location.hash;
  let m=h.match(/^#\/p\/(\d+)\/(materials|review|versions)$/);
  if(m){S.pid=+m[1];S.page=m[2]}
  else if(h==="#/materials"||h==="#/review"||h==="#/versions"){S.page=h.slice(3)}
  else{S.page="projects";S.pid=0}
  render();
}
function render(){renderSide();renderTopbar();const app=$("#app");
  app.className="content"+(S.page==="review"?" fixed":"");
  if(!S.page||S.page==="projects")app.innerHTML=viewProjects();
  else if(S.page==="materials")app.innerHTML=viewMaterials();
  else if(S.page==="review")app.innerHTML=viewReview();
  else if(S.page==="versions")app.innerHTML=viewVersions();
  bind();}

   const draft=st.draft==="reviewing"?`<span class="tag warn"><span class="dot"></span>草案评审中</span>`:`<span class="tag mute"><span class="dot"></span>无</span>`;
   return`<tr class="clickable" data-enter="${p.id}">
    <td><div style="font-weight:600">${esc(p.name)}</div><div style="color:var(--muted);font-size:.8rem;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.desc||"")}</div></td>
    <td><span class="num">${st.materials}</span></td>
    <td>${st.anno?`<span class="tag warn"><span class="dot"></span>${st.anno} 待评审</span>`:`<span class="tag mute"><span class="dot"></span>0</span>`}</td>
    <td><span class="num">${st.version}</span></td>
    <td>${draft}</td>
    <td style="white-space:nowrap;text-align:right">${p.archived?`<button class="btn sm" data-restore="${p.id}">${IC.undo} 恢复</button>`:`<button class="icon-btn" data-edit="${p.id}" title="编辑">${IC.edit}</button><button class="icon-btn" data-archive="${p.id}" title="归档">${IC.arch}</button>`}</td></tr>`}).join("")
   ||`<tr><td colspan="6"><div class="empty">${S.projTab==="archived"?"没有归档项目":"尚无项目,点击右上角新建"}</div></td></tr>`;
  return`<div class="page-head"><div><h1 class="pv">项目总览</h1><div class="pv-sub">平台按项目隔离资源:材料池、文档与批注、版本历史</div></div><div class="spacer"></div><button class="btn primary" id="btnNewProj">${IC.plus} 新建项目</button></div>
   <div class="seg" style="margin-bottom:16px;display:inline-flex"><button class="${S.projTab==="active"?"active":""}" data-tab="active">进行中</button><button class="${S.projTab==="archived"?"active":""}" data-tab="archived">归档</button></div>
   <div class="card"><table class="tbl"><thead><tr><th>项目</th><th>材料</th><th>批注</th><th>当前版本</th><th>草案</th><th style="text-align:right">操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  modal({title:isEdit?"编辑项目":"新建项目",

function archiveDialog(p){
  modal({title:"归档项目",
   body:`<div class="field" id="fA"><label>输名确认:输入 <b>${esc(p.name)}</b></label><input type="text" id="inpA" placeholder="项目名称"><div class="err-msg">名称不一致</div></div>

function uploadFlow(name,type){
  const mats=DB.materials[S.pid];
  if(/overview\.md$/i.test(name)){toast("材料已存在:hanhai-multimodal-requirements-overview.md(hash 相同)","warn");return}
  const hash=Array.from({length:12},()=>"0123456789abcdef"[Math.random()*16|0]).join("");
  const m={id:Date.now(),name,type,hash,size:"12 KB",time:"刚刚",parsed:type==="img"?"":"(解析中)…"};
  mats.unshift(m);curProj().stats.materials=mats.length;render();
  toast(`已接收 ${name},解析中…`);
  setTimeout(()=>{m.parsed=`《${name}》解析文本(mock)……用于展示出处核对用途。`;render()},1300);
}
function matDrawer(m){
  const mask=document.createElement("div");mask.className="drawer-mask";
  const d=document.createElement("div");d.className="drawer";
  d.innerHTML=`<div class="dr-head"><h3>${esc(m.name)}</h3><button class="icon-btn" id="drC" aria-label="关闭"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
   <div class="dr-meta"><span class="hash">${m.hash}</span><span>${m.size}</span><span>${m.time}</span><span class="mt ${m.type}">${m.type.toUpperCase()}</span></div>
   <div class="dr-body">${m.parsed?`<div class="sl" style="margin-top:0">解析文本(parsed_text)</div><div class="parsed">${esc(m.parsed)}</div>`:`<div class="empty">图片材料:解析文本为空,规则引用本材料时跳过出处硬校验</div>`}</div>`;
  const close=()=>{mask.remove();d.remove()};
  mask.addEventListener("click",close);d.querySelector("#drC").addEventListener("click",close);
  document.body.append(mask,d);

/* ═════════════ 文档评审页(批注式)═════════════ */
function annoMark(a){
  const done=isAns(a);
  return`<mark class="anno ${done?"resolved":""}" data-a="${a.id}" id="mk-${a.id}">${esc(a.anchor.seg)}<sup>${a.id}</sup></mark>`;
}
function ruleTextHtml(chId,rule){
  const annos=openAnnos().filter(a=>a.ch===chId&&a.anchor.rule===rule.no);
  let html=esc(rule.text);
  annos.filter(a=>a.anchor.seg).forEach(a=>{
    html=html.replace(esc(a.anchor.seg),()=>annoMark(a)); /* replacer 防止 $ 序列 */
  });
  /* term 型批注若 seg 在文本中(术语锚)同样替换 */
  return html;
}
function annoCard(a){
  const done=isAns(a);const v=S.answers[a.id];
  const closed=!S.openA.has(a.id);
  let ops="";
  if(a.kind==="choice")ops=`<div class="a-ops">${a.opts.map(o=>`
    <label class="aopt ${v===o.k?"sel":""}"><span class="k">${o.k}</span><span>${esc(o.t)}${o.c?`<span class="c">${esc(o.c)}</span>`:""}</span></label>`).join("")}</div>`;
  if(a.kind==="confirm")ops=`<div class="abtns"><button class="btn sm yes ${v==="yes"?"sel":""}" data-c="${a.id}|yes">${IC.check} 确认</button><button class="btn sm no ${v==="no"?"sel":""}" data-c="${a.id}|no">不对</button></div>`;
  if(a.kind==="term")ops=`<div class="afield"><input type="text" data-f="${a.id}" placeholder="给一句定义…" value="${esc(v&&v.def||"")}"></div>
    <div class="abtns"><button class="btn sm yes ${v?"sel":""}" data-term-ok="${a.id}">${IC.check} 收录</button></div>`;
  if(a.kind==="fill")ops=`<div class="afield"><input type="text" data-f="${a.id}" placeholder="一句话作答…" value="${esc(v||"")}"></div>`;
  if(a.kind==="scan")ops=`<div class="scanmini">${a.items.map((it,i)=>`
    <label class="sr ${v&&v[i]!==undefined?"done":""}"><input type="checkbox" data-s="${a.id}|${i}" ${v&&v[i]?"checked":""}>
    <span>${esc(it)}</span><span class="mk">✓</span></label>`).join("")}</div>`;
  const ansMark=done?`<div class="a-done">${IC.check}<span class="da-text">${
    a.kind==="choice"?esc(a.opts.find(o=>o.k===v)?.t||""):
    a.kind==="confirm"?(v==="yes"?"已确认":"已纠正"):
    a.kind==="term"?esc("已收录:"+((v&&v.def)||"")):
    a.kind==="fill"?esc(v||"已作答"):"全部通过"}</span></div>`:"";
  return`<div class="acard ${done?"ok":""} ${closed?"closed":""}" id="ac-${a.id}" data-ac="${a.id}">
   <div class="a-top" title="${esc(a.q)}">
     <span class="a-q">${esc(a.q)}</span>
     ${done?"":`<button class="a-locate" data-locate="${a.id}" title="定位到正文" aria-label="定位到正文"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>`}
     <span class="a-chev">▸</span></div>
   <div class="a-meta"><span class="a-id">${a.id}</span><span>·</span><span class="a-kind">${a.klabel}</span></div>
   <div class="a-body">
     ${a.ctx?`<div class="a-ctx">${esc(a.ctx)}</div>`:""}
     ${done?ansMark:ops}
     ${done&&a.kind!=="scan"?`<div class="abtns" style="margin-top:8px"><button class="btn sm" data-undo="${a.id}">重新作答</button></div>`:""}
   </div></div>`;
}
function viewReview(){
  renderTopbar();
  const d=DB.doc;const annos=openAnnos();const done=doneAnnos();
  const cAnno=ch=>annos.filter(a=>a.ch===ch.id).length;
  const toc=`<nav class="toc"><div class="t">章节</div>
   ${d.chapters.map(c=>`<a href="#ch-${c.id}" data-toc="${c.id}" class="${c.id==="c3"?"current":""}">${esc(c.title.split("/").pop())}${cAnno(c)?`<span class="n-anno">${cAnno(c)}</span>`:""}</a>`).join("")}
   <div class="gloss"><div class="t">术语表</div>${d.glossary.map(g=>`<a href="javascript:void 0" title="${esc(g.def)}">${esc(g.name)}</a>`).join("")}</div></nav>`;
  const chapters=d.chapters.map(c=>{
    const chAnnos=annos.filter(a=>a.ch===c.id&&a.anchor.chapter);
    return`<section class="chapter" id="ch-${c.id}">
     <h2>${esc(c.title)}<span class="pri">${c.pri}</span>${chAnnos.map(a=>`<span class="ch-anno" data-a="${a.id}">${IC.pen} ${a.klabel} ×${chAnnos.length}</span>`).join("")}</h2>
     <div class="sl">背景初衷</div><p class="bg">${esc(c.bg)}</p>
     <div class="sl">状态机</div>${c.states?`<div class="flowbox">${c.states.split("→").map((s,i)=>`${i?`<span class="farr">→</span>`:""}<span class="fnode ${/SUCCEEDED|CANCELLED|失败/.test(s.trim())?"term":""}">${esc(s.trim())}</span>`).join("")}</div>`:`<div class="a-ctx" style="color:var(--danger);border-left-color:var(--danger)">待补充 —— 见右侧批注</div>`}
     ${c.exceptions.length?`<div class="sl">异常路径</div><ul class="exc">${c.exceptions.map((e,i)=>`<li><span class="e">E${i+1}</span><span>${esc(e)}</span></li>`).join("")}</ul>`:""}
     <div class="sl">规则</div>
     ${c.rules.length?c.rules.map(r=>{
       const det=d.ruleDetail[r.no]||{};
       return`<div class="rline"><span class="rno" data-rule="${r.no}" title="点击查看可判定表述与出处">${r.no}</span><p>${ruleTextHtml(c.id,r)}</p><span class="rv" title="违反判定">${esc((det.violation||"").slice(0,14))||"—"}</span></div>`}).join("")
      :`<div class="a-ctx" style="color:var(--danger);border-left-color:var(--danger)">本章暂无可判定规则 —— 见右侧批注</div>`}
    </section>`}).join("");
  /* 右栏 */
  const groups=[...new Set(annos.map(a=>a.group))];
  const railHtml=S.revMode==="side"
   ?`<div class="anno-rail"><div class="anno-head"><span class="sum">待处理 <b>${annos.length-done.length}</b> / ${annos.length}</span>
      <span style="flex:1"></span>
      <div class="seg"><button class="active" title="对照评审">对照</button><button data-mode="focus" title="逐条评审">逐条</button></div></div>
     <div class="anno-list">${groups.map(g=>`<div class="agroup">${esc(g)}</div>`+annos.filter(a=>a.group===g).map(annoCard).join("")).join("")}</div></div>`
   :(()=>{const a=annos[S.focusIdx]||annos[0];if(!a)return"";
     S.openA.add(a.id); /* 焦点卡强制展开 */
     return`<div class="anno-rail"><div class="focusbox">
      <div class="focus-top"><span class="fp"><b>${S.focusIdx+1}</b> / ${annos.length}</span>
       <div class="focus-nav"><button class="btn sm" data-fstep="-1">上一条</button><button class="btn sm primary" data-fstep="1">下一条</button></div></div>
      ${annoCard(a)}
      <div class="focus-jump"><span class="fq">${a.id}</span><span>正文位置:第 ${esc(String(DB.doc.chapters.findIndex(c=>c.id===a.ch)+1))} 章 · ${a.anchor.rule?esc("规则 "+a.anchor.rule):esc("章节")} ${a.anchor.seg?`「${esc(a.anchor.seg)}」`:""}</span><button class="btn sm" data-jump="${a.id}" style="margin-left:auto">定位正文</button></div>
     </div>
     <div class="anno-head" style="margin-top:12px"><span class="sum">待处理 <b>${annos.length-done.length}</b> / ${annos.length}</span><span style="flex:1"></span>
      <div class="seg"><button data-mode="side" title="对照评审">对照</button><button class="active" title="逐条评审">逐条</button></div></div></div>`})();
  const wCls=S.docWidth==="wide"?"wide":S.docWidth==="full"?"full":"";
  /* 页宽图形化图标:页面轮廓内不同宽度的填充条 */
  const wIcon=w=>`<span class="mm-ic"><svg width="22" height="14" viewBox="0 0 22 14" fill="none"><rect x="0.5" y="0.5" width="21" height="13" rx="2.5" stroke="currentColor" opacity=".45"/><rect x="${w}" y="4" width="${22-2*w}" height="6" rx="1" fill="currentColor"/></svg></span>`;
  const wOpt=(k,label,ic)=>`<button data-w="${k}" class="${S.docWidth===k?"sel":""}">${ic}<span class="mm-lb">${label}</span><span class="mm-dot"></span></button>`;
  return`<div class="rev-toolbar">
    <span class="tag warn"><span class="dot"></span>草案评审中</span>
    <span style="font-size:.82rem;color:var(--muted)">基于 <b>v2</b> · 修改 1 / 新增 2 / 术语 2</span>
    <span class="spacer"></span>
    <button class="btn primary sm" id="btnFinalize">定稿发版</button>
    <div class="more-wrap">
      <button class="more-btn" id="btnMore" aria-label="更多设置" title="更多设置"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
      <div class="more-menu" id="moreMenu" hidden>
        <div class="mm-t">阅读设置 · 页宽</div>
        ${wOpt("normal","常规",wIcon(7))}${wOpt("wide","超宽",wIcon(4))}${wOpt("full","全宽",wIcon(1.5))}
      </div>
    </div>
   </div>
   <div class="rev-body ${wCls}">
    <aside class="rev-col" style="padding:14px 10px 30px">${toc}</aside>
    <div class="rev-col doc-col"><div class="docpaper">
      <div class="doc-title">多模态 · 需求文档</div>
      <div class="doc-meta"><span>${d.ver}</span><span>${d.date}</span><span>范围:${esc(d.scope)}</span></div>
      ${chapters}</div></div>
    <aside class="rev-col rail-col">${railHtml}</aside>
   </div>`;
}
function updateAnnoLive(aid){
  const a=openAnnos().find(x=>x.id===aid);const card=document.getElementById("ac-"+aid);if(!a||!card)return;
  const done=isAns(a);
  if(done)S.openA.delete(aid); /* 答完自动收起 */
  const mk=document.getElementById("mk-"+aid);if(mk)mk.classList.toggle("resolved",done);
  const tmp=document.createElement("div");tmp.innerHTML=annoCard(a);
  const fresh=tmp.firstElementChild;   /* 先取引用:replaceWith 会把节点移出 tmp */
  card.replaceWith(fresh);
  bindAnnoCard(fresh);
  updateRailStats();
}
function bindAnnoCard(card){
  card.addEventListener("click",e=>{
    if(e.target.closest("label.aopt,button,input"))return;
    const id=card.dataset.ac;
    document.querySelectorAll(".acard.active").forEach(c=>{if(c!==card)c.classList.remove("active")});
    card.classList.add("active");
    card.classList.toggle("closed");
    if(card.classList.contains("closed"))S.openA.delete(id);else S.openA.add(id);});
  card.querySelector("[data-locate]")?.addEventListener("click",e=>{
    e.stopPropagation();const id=card.dataset.locate||card.dataset.ac;
    document.querySelectorAll(".acard.active").forEach(c=>c.classList.remove("active"));
    card.classList.add("active");card.classList.remove("closed");S.openA.add(id);
    jumpToAnno(id)});
  card.querySelectorAll(".aopt").forEach(l=>l.addEventListener("click",()=>{const a=openAnnos().find(x=>x.id===card.dataset.ac);if(!a)return;
    S.answers[a.id]=l.querySelector(".k").textContent;updateAnnoLive(a.id)}));
  card.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{const[qid,v]=b.dataset.c.split("|");S.answers[qid]=v==="yes"?"yes":"no";updateAnnoLive(qid)}));
  card.querySelectorAll("[data-term-ok]").forEach(b=>b.addEventListener("click",()=>{const qid=b.dataset.termOk;const inp=card.querySelector(`[data-f="${qid}"]`);
    S.answers[qid]={def:inp?inp.value:""};updateAnnoLive(qid)}));
  card.querySelectorAll("[data-f]").forEach(inp=>inp.addEventListener("input",()=>{const qid=inp.dataset.f;const a=openAnnos().find(x=>x.id===qid);if(!a)return;
    if(a.kind==="term")S.answers[qid]={def:inp.value};else S.answers[qid]=inp.value}));
  card.querySelectorAll("[data-s]").forEach(cb=>cb.addEventListener("change",()=>{const[qid,i]=cb.dataset.s.split("|");
    S.answers[qid]=S.answers[qid]||{};if(cb.checked)S.answers[qid][i]=true;else delete S.answers[qid][i];
    const row=cb.closest(".sr");const a=openAnnos().find(x=>x.id===qid);
    if(row)row.classList.toggle("done",!!(S.answers[qid]&&S.answers[qid][i]));
    if(a&&isAns(a))updateAnnoLive(qid)}));
  card.querySelectorAll("[data-undo]").forEach(b=>b.addEventListener("click",()=>{delete S.answers[b.dataset.undo];S.openA.add(b.dataset.undo);updateAnnoLive(b.dataset.undo)}));
}
function updateRailStats(){
  const annos=openAnnos(),done=doneAnnos();
  const sum=document.querySelector(".anno-head .sum");
  if(sum)sum.innerHTML=`待处理 <b>${annos.length-done.length}</b> / ${annos.length}`;
  const p=curProj();if(p)p.stats.anno=annos.length-done.length;
  renderSide();
}
function jumpToAnno(aid){
  const mk=document.getElementById("mk-"+aid);
  if(mk){mk.scrollIntoView({behavior:"smooth",block:"center"});
    mk.classList.add("hit");setTimeout(()=>mk.classList.remove("hit"),1400);return}
  const ch=openAnnos().find(x=>x.id===aid)?.ch;
  const sec=ch&&document.getElementById(`ch-${ch}`);if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});
}
function rulePopover(no){
  const det=DB.doc.ruleDetail[no]||{};const mat=DB.materials[S.pid]?.find(m=>m.id===det.mat);
  return`<div class="popover" style="position:absolute;z-index:60;width:min(400px,70vw);background:var(--card);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-lg);padding:14px;margin-top:6px;animation:pop .15s ease">
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span style="font-family:var(--mono);font-weight:700;font-size:.74rem;color:var(--primary-dark);background:var(--primary-soft);padding:1px 8px;border-radius:4px">${no}</span><span style="font-size:.74rem;color:var(--muted)">规则详情</span></div>
   <div style="font-size:.84rem;margin-bottom:8px"><b style="font-size:.72rem;color:var(--faint);display:block;text-transform:uppercase;letter-spacing:.05em">怎样算违反</b>${esc(det.violation||"—")}</div>
   ${det.quote?`<div style="font-size:.8rem;margin-bottom:8px"><b style="font-size:.72rem;color:var(--faint);display:block;text-transform:uppercase;letter-spacing:.05em">出处引用</b><span style="background:#FFFBEB;border-left:2px solid #F59E0B;padding:4px 9px;display:block;color:#78350F">“${esc(det.quote)}”</span></div>`:""}
   ${mat?`<div style="font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:center">${IC.file} ${esc(mat.name)} <span class="hash">${mat.hash}</span></div>`:`<div style="font-size:.76rem;color:var(--muted)">图片类材料 · 跳过出处核对</div>`}
  </div>`;
}

/* ═════════════ 版本页 ═════════════ */
function viewVersions(){
  renderTopbar();
  const d=DB.doc;
  const vlist=[{ver:"草案",date:"评审中",note:"修改1/新增2/术语2",draft:true},...d.versions].map(v=>`
   <div class="vitem ${S.selVer===v.ver?"sel":""}" ${v.draft?"":`data-ver="${v.ver}"`}>
    <div class="vv">${v.draft?"(草案)":v.ver}${v.draft?`<span class="tag warn"><span class="dot"></span>评审中</span>`:`<span class="tag ok"><span class="dot"></span>已定稿</span>`}
     ${v.draft?"":`<button class="btn sm v-act" data-revert="${v.ver}" title="以该版为当前基线">回退到此版</button>`}</div>
    <div class="vd">${v.date} · ${esc(v.note)}</div></div>`).join("");
  const rows=(S.selVer==="草案"?[]:d.changelog[S.selVer]||[]).map(c=>{
    const tb={added:"ok",modified:"warn",voided:"err"}[c.type];const tt={added:"新增",modified:"修改",voided:"作废"}[c.type];
    return`<div class="crow"><div class="ch" data-cl><span class="cno">${c.no}</span><span class="tag ${tb}"><span class="dot"></span>${tt}</span><span class="cs">${esc(c.sum)}</span><span style="color:var(--faint);font-size:.78rem">▾</span></div>
     <div class="cb" hidden>
      ${c.type==="modified"?`<div class="diff2"><div class="old"><div class="dl">旧</div><div class="dt">${esc(c.oldT)}</div></div><div class="new"><div class="dl">新</div><div class="dt">${esc(c.newT)}</div></div></div>`:""}
      ${c.type==="added"?`<div class="diff2"><div class="new" style="grid-column:1/3"><div class="dl">新增内容</div><div class="dt">${esc(c.newT)}</div></div></div>`:""}
      <div class="cmeta"><span>原因:${esc(c.reason)}</span><span>批准:${esc(c.approver)}</span></div></div></div>`}).join("")
   ||`<div class="card"><div class="empty">${S.selVer==="草案"?"发版后生成变更记录":"该版本无变更记录"}</div></div>`;
  return`<div class="page-head"><div><h1 class="pv">版本</h1><div class="pv-sub">定稿即基线:只增不改,条款级变更留痕,可回看任意历史版</div></div></div>
   <div class="ver-layout"><div class="card" style="padding:14px 12px 6px"><div class="vline">${vlist}</div></div>
   <div><div class="page-head" style="margin-bottom:12px"><div><h1 class="pv" style="font-size:1.05rem">${S.selVer} 变更记录</h1></div></div>${rows}</div></div>`;
}

/* ═════════════ 定稿发版(自定义版本号)═════════════ */
function finalizeDialog(){
  const d=DB.doc;const annos=openAnnos();const undone=annos.length-doneAnnos().length;
  const suggest=`v${DB.doc.versions.length+1}`;
  modal({title:"定稿发版",
   body:`<div class="field" id="fVer"><label>版本号 <span class="req">*</span></label>
     <input type="text" id="inpVer" value="${suggest}" placeholder="如 v3 或 v2.1">
     <div class="err-msg">版本号必填,且不能与历史版本重复</div></div>
    <div class="field"><label>发版说明</label><textarea id="inpNote" placeholder="这一版改了什么、为什么(写入版本历史)"></textarea></div>
    <ul style="font-size:.86rem;color:var(--fg-2);display:grid;gap:6px;padding-left:18px">
     <li>修改 <b>1</b> 条 · 新增 <b>2</b> 条规则,术语表按快照重建</li>
     ${undone?`<li style="color:var(--anno)">尚有 <b>${undone}</b> 条批注未处理:标记为「发版时未决」,不阻塞</li>`:`<li>全部批注已处理 ✓</li>`}</ul>
    <p style="font-size:.8rem;color:var(--muted);margin-top:12px">批准人 owner · 发版后版本只增不改,可回看与回退</p>`,
   foot:`<button class="btn" data-close>再想想</button><button class="btn primary" id="btnF">确认发版</button>`});
  $("#btnF").addEventListener("click",()=>{
    const ver=$("#inpVer").value.trim();
    if(!ver||d.versions.some(v=>v.ver===ver)){$("#fVer").classList.add("invalid");$("#inpVer").focus();return}
    const note=$("#inpNote").value.trim()||"收敛草案批注";
    const p=curProj();p.stats.version=ver;p.stats.draft=null;p.stats.anno=0;
    d.versions.unshift({ver,date:"2026-10-14",note});
    $("#modalRoot").innerHTML="";toast(`已发版 ${ver}`);
    location.hash=`#/p/${S.pid}/versions`;S.selVer=ver;render()});
}
function revertDialog(ver){
  modal({title:`回退到 ${ver}`,
   body:`<p style="font-size:.9rem;color:var(--fg-2)">将 <b>${ver}</b> 设为当前基线:</p>
    <ul style="font-size:.86rem;color:var(--fg-2);display:grid;gap:6px;padding-left:18px;margin-top:8px">
     <li>后续草案基于 <b>${ver}</b> 加工</li>
     <li>${ver} 之后的版本保留在历史中,不删除</li></ul>
    <p style="font-size:.8rem;color:var(--muted);margin-top:12px">当前评审中的草案将作废,需 agent 重新基于基线提交。</p>`,
   foot:`<button class="btn" data-close>取消</button><button class="btn primary" id="btnRev">确认回退</button>`});
  $("#btnRev").addEventListener("click",()=>{
    const p=curProj();p.stats.version=ver;
    $("#modalRoot").innerHTML="";toast(`已回退,当前基线 ${ver}`,"warn");
    render()});
}

/* ═════════════ 事件绑定 ═════════════ */
function bind(){
  const app=$("#app");
  app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.projTab=b.dataset.tab;render()}));
  $("#btnNewProj")?.addEventListener("click",()=>projDialog(null));
  app.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();projDialog(DB.projects.find(p=>p.id==b.dataset.edit))}));
  app.querySelectorAll("[data-archive]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();archiveDialog(DB.projects.find(p=>p.id==b.dataset.archive))}));
  app.querySelectorAll("[data-restore]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const p=DB.projects.find(x=>x.id==b.dataset.restore);p.archived=false;toast(`「${p.name}」已恢复`);render()}));
  app.querySelectorAll("[data-enter]").forEach(tr=>tr.addEventListener("click",e=>{if(e.target.closest("button"))return;location.hash=`#/p/${tr.dataset.enter}/review`}));
  /* 材料 */
  $("#btnUploadTop")?.addEventListener("click",()=>$("#fileInput")?.click()||($("#uz")?.click()));
  const uz=$("#uz");
  if(uz){uz.addEventListener("click",()=>$("#fileInput").click());
   uz.addEventListener("dragover",e=>{e.preventDefault();uz.classList.add("dragover")});
   uz.addEventListener("dragleave",()=>uz.classList.remove("dragover"));
   uz.addEventListener("drop",e=>{e.preventDefault();uz.classList.remove("dragover");[...e.dataTransfer.files].forEach(f=>uploadFlow(f.name,/\.(png|jpe?g|webp)$/i.test(f.name)?"img":/\.pdf$/i.test(f.name)?"pdf":/\.md$/i.test(f.name)?"md":"txt"))});
   uz.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#fileInput").click()}});
   $("#fileInput").addEventListener("change",e=>{[...e.target.files].forEach(f=>uploadFlow(f.name,/\.(png|jpe?g|webp)$/i.test(f.name)?"img":/\.pdf$/i.test(f.name)?"pdf":/\.md$/i.test(f.name)?"md":"txt"));e.target.value=""});}
  app.querySelectorAll("[data-mat]").forEach(tr=>tr.addEventListener("click",()=>{S.selMat=+tr.dataset.mat;const m=(DB.materials[S.pid]||[]).find(x=>x.id===S.selMat);render();matDrawer(m)}));
  /* 评审:批注联动 */
  app.querySelectorAll("mark.anno").forEach(mk=>mk.addEventListener("click",()=>{
    const card=document.getElementById(`ac-${mk.dataset.a}`);
    document.querySelectorAll(".acard.active").forEach(c=>c.classList.remove("active"));
    if(card){card.classList.add("active");card.scrollIntoView({behavior:"smooth",block:"center"})}}));
  app.querySelectorAll(".ch-anno").forEach(el=>el.addEventListener("click",()=>jumpToAnno(el.dataset.a)));
  /* 批注卡:单一绑定路径(toggle/定位/作答控件全在 bindAnnoCard) */
  app.querySelectorAll(".acard").forEach(bindAnnoCard);
  /* 页宽切换(在「更多」菜单中):不重渲染,保持滚动位置 */
  const moreBtn=$("#btnMore"),moreMenu=$("#moreMenu");
  if(moreBtn&&moreMenu){
    moreBtn.addEventListener("click",e=>{e.stopPropagation();moreMenu.hidden=!moreMenu.hidden});
    moreMenu.addEventListener("click",e=>e.stopPropagation());
    document.addEventListener("click",()=>{if(moreMenu)moreMenu.hidden=true});
  }
  app.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{
    S.docWidth=b.dataset.w;
    document.querySelectorAll("[data-w]").forEach(x=>x.classList.toggle("sel",x.dataset.w===S.docWidth));
    if(moreMenu)moreMenu.hidden=true;
    const body=$(".rev-body");if(body){body.classList.remove("wide","full");if(S.docWidth!=="normal")body.classList.add(S.docWidth)}}));
  /* 作答控件统一由 bindAnnoCard 绑定 */
  /* 模式切换/逐条 */
  app.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{S.revMode=b.dataset.mode;render()}));
  app.querySelectorAll("[data-fstep]").forEach(b=>b.addEventListener("click",()=>{const n=openAnnos().length;S.focusIdx=(S.focusIdx+ +b.dataset.fstep+n)%n;render();
    const annos=openAnnos();const a=annos[S.focusIdx];if(a)setTimeout(()=>jumpToAnno(a.id),80)}));
  app.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>jumpToAnno(b.dataset.jump)));
  /* 规则 popover */
  app.querySelectorAll("[data-rule]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    const exist=el.parentElement.querySelector(".popover");
    document.querySelectorAll(".popover").forEach(p=>p.remove());
    if(exist)return;
    el.parentElement.insertAdjacentHTML("beforeend",rulePopover(el.dataset.rule))}));
  document.addEventListener("click",e=>{if(!e.target.closest(".popover")&&!e.target.closest("[data-rule]"))document.querySelectorAll(".popover").forEach(p=>p.remove())});
  /* 定稿发版(打回与回退已移至版本管理页) */
  $("#btnFinalize")?.addEventListener("click",finalizeDialog);
  /* 版本页 */
  app.querySelectorAll(".vitem[data-ver]").forEach(v=>v.addEventListener("click",e=>{
    if(e.target.closest("[data-revert]"))return;
    S.selVer=v.dataset.ver;render()}));
  app.querySelectorAll("[data-revert]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();revertDialog(b.dataset.revert)}));
  app.querySelectorAll(".crow .ch").forEach(h=>h.addEventListener("click",()=>{const b=h.parentElement.querySelector(".cb");b.hidden=!b.hidden}));
}
window.addEventListener("hashchange",route);
route();
</script>
